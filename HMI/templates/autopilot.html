<!-- templates/autopilot.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Heading & Rudder</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 60px;
            color: white; /*Font Color*/
            background-color: black;
            height: 100vh; 
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;   /* header | main | footer  */
            grid-template-areas:
                "hdr"
                "main"
                "ftr";
            margin: 0;
            padding: 0;
        }

        .main-grid {
            grid-area: main;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0;
            height: 100%;
            align-items: middle;
        }

        #btnPortGoal, #btnStarGoal, #btnPortRudder, #btnStarRudder {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }

        .side-col-left,
        .side-col-right {
            display: grid;
            grid-template-rows: auto 1fr auto;
            place-items: center;
        }

        .side-col-left img,
        .side-col-right img {
            width: 100%;
            height: auto;
            cursor: pointer;
            max-width: 25lh;
        }

        .center-col {
            display:flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
             max-width: 50lh;
        }

        canvas#compass {
            aspect-ratio: 1/1;
            background: #fafafa;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        #autopilotBtn {
            font-size: 90px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #autopilotBtn.disabled {
            background-color: lightgreen;
            color: black;
        }
        #autopilotBtn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }

        #servoToggleBtn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #servoToggleBtn.disabled {
            background-color: lightgreen;
            color: black;
        }

        #servoToggleBtn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }
        button:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <div class="main-grid">
        <div class="side-col-left" id="left">
            <div class="port-side-row top">
                <button id="btnPortGoal">
                    <img src="/static/images/RedPortArrowLabeled.png" alt="Port Goal">
                </button>
            </div>
            <div class="port-side-row middle" id="leftMiddle">
                <button id="autopilotBtn">Engage<br>Autopilot</button>
                <p>
                Steering Goal:<br>
                <span style="font-family:monospace; font-size:120px; white-space:pre;" id="steeringGoal">-------</span><br>
                Steering Val:<br>
                <span style="font-family:monospace; font-size:120px; white-space:pre;"  id="steeringValue">----</span>
                </p>
            </div>
            <div class="port-side-row bottom" id="leftBottom">
                <button id="btnPortRudder">
                    <img src="/static/images/RudderArrowLeft.png" alt="Port Rudder">
                </button>
            </div>
        </div>

        <div class="center-col" id="center">
            <canvas id="compass"></canvas>
        </div>

        <div class="side-col-right" id="right">
            <div class="star-side-row top">
                <button id="btnStarGoal">
                    <img src="/static/images/GreenStarboardArrowLabeled.png" alt="Starboard Goal">
                </button>
            </div>
            <div class="star-side-row middle" id="rightMiddle">
                <span style="font-size:48px" id="servoEnabled">Servo is Disabled</span>
                <br>
                <button id="servoToggleBtn">Enable Servo</button>
                <p style="align-items:right;">Engine Speed:<br>
                    <span style="font-family:monospace; font-size:120px; white-space:pre;" id="EngineSpeed">----</span></p>
            </div>
            <div class="star-side-row bottom" id="rightBottom">
                <button id="btnStarRudder">
                    <img src="/static/images/RudderArrowRight.png" alt="Starboard Rudder">
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/compass.js"></script>
    <script>
       
    </script>
</body>
</html>
