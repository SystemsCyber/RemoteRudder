<!-- templates/autopilot.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Heading & Rudder</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 60px;
            color: white; /*Font Color*/
            background-color: black;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        header, footer {
            padding: 10px;
            text-align: center;
            flex: 0 0 auto;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr; /* left, center, right */
            
        }

        .left, .right {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            height: 100%;
            }
        .left { 
            justify-content: right;
        }
        .right { 
            justify-content: left;
        }

        .center {
            align-items: center;
            justify-content: center;
            height: 100%;
            overflow: hidden;
            display: flex;
        }


        #btnPortGoal, #btnStarGoal, #btnPortRudder, #btnStarRudder {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }


        .left img,
        .right img {
            cursor: pointer;
            max-height: 300px;
        }

        canvas#compass {
            aspect-ratio: 1/1;
            background: #fafafa;
            height: 100%;
            border-radius: 50%;
            
        }

        #autopilotBtn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #autopilotBtn.disabled {
            background-color: lightgreen;
            color: black;
        }
        #autopilotBtn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }

        #servoToggleBtn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #servoToggleBtn.disabled {
            background-color: lightgreen;
            color: black;
        }

        #servoToggleBtn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }
        button:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <!-- <header>Autopilot Control</header> -->
    <div  class="container">
        <div class="left" id="left">
            <button id="btnPortGoal">
                <img src="/static/images/RedPortArrowLabeled.png" alt="Port Goal">
            </button>
            <p>
            <span style="font-size:48px" id="autopilotStatus">Autopilot Disengaged</span>
            <br>
            <button id="autopilotBtn">Engage Autopilot</button>
            </p>
            <p>
            Steering Goal:<br>
            <span style="font-family:monospace; font-size:90px; white-space:pre;" id="steeringGoal">------</span><br>
            Steering Val:<br>
            <span style="font-family:monospace; font-size:90px; white-space:pre;"  id="steeringValue">----</span>
            </p>
        </div>
        
        <div class="center" id="center">
            <canvas id="compass"></canvas>
        </div>

        <div class="right" id="right">
            <button id="btnStarGoal">
                <img src="/static/images/GreenStarboardArrowLabeled.png" alt="Starboard Goal">
            </button>
            <p>
                <span style="font-size:48px" id="servoEnabled">Servo is Disabled</span>
                <br>
                <button id="servoToggleBtn">Enable Servo</button>
            </p>        
            <p style="align-items:right;">Engine Speed:<br>
                <span style="font-family:monospace; font-size:90px; white-space:pre;" id="EngineSpeed">----</span>
            </p>
        </div>
    </div>
    <!-- <footer>CAN</footer> -->
    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/compass.js"></script>
    <script>
       
    </script>
</body>
</html>
