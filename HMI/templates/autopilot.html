<!-- templates/autopilot.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Autopilot</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 60px;
            color: white; /*Font Color*/
            background-color: black;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        header, footer {
            padding: 10px;
            text-align: center;
            flex: 0 0 auto;
        }
        
        footer {
            background-color: #333;
            color: white;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }   

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr; /* left, center, right */
            
        }

        .left, .right {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr ;
            align-items: center;
            padding: 10px;
            height: 100%;
            }
        .left { 
            justify-content: right;
        }
        .right { 
            justify-content: left;
        }

        .center {
            align-items: center;
            justify-content: center;
            height: 100%;
            overflow: hidden;
            display: flex;
        }


        #btnPortGoal, #btnStarGoal, #btnPortRudder, #btnStarRudder {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }


        .left img,
        .right img {
            cursor: pointer;
            max-height: 200px;
        }

        canvas#compass {
            aspect-ratio: 1/1;
            background: #fafafa;
            height: 100%;
            border-radius: 50%;
            
        }

        #autopilotBtn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #autopilotBtn.disabled {
            background-color: lightgreen;
            color: black;
        }
        #autopilotBtn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }

        #LeftTurn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #LeftTurn.disabled {
            background-color: lightgreen;
            color: black;
        }
        #LeftTurn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }

        #RightTurn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #RightTurn.disabled {
            background-color: lightgreen;
            color: black;
        }
        #RightTurn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }

        #servoToggleBtn {
            font-size: 60px;
            padding: 0.5em 0.5em;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #servoToggleBtn.disabled {
            background-color: lightgreen;
            color: black;
        }

        #servoToggleBtn.enabled {
            background-color: rgb(255, 82, 82);
            color: black;
        }

        button:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
        }

    </style>
</head>
<body>
    <!-- <header>Autopilot Control</header> -->
    <div  class="container">
        <div class="left" id="left">
            <div id="left_1">
                <button id="btnPortGoal">
                    <img src="/static/images/RedPortArrowLabeled.png" alt="Port Goal">
                </button>
            </div>
            <div id="left_2">
                <span style="font-size:48px" id="autopilotStatus">Autopilot Disengaged</span><br>
                <button id="autopilotBtn">Engage Autopilot</button>
            </div>
            <div style="font-size:42px" id="left_3">
                Steering Goal:<br>
                <span style="font-family:monospace;  white-space:pre;" id="steeringGoal">------</span><br>
                <hidden>
                    Steering Val:<br>
                    <span style="font-family:monospace; white-space:pre;"  id="steeringValue">----</span> 
                </hidden>
            </div>
            <div id="left_4">
                <span style="font-size:48px" id="left_turn_message">Turn Disabled</span><br>
                <button id="LeftTurn">
                    Left Turn
                </button>
            </div>
        </div>
        
        <div class="center" id="center">
            <canvas id="compass"></canvas>
        </div>

        <div class="right" id="right">
            <div id="right_1">
                <button id="btnStarGoal">
                    <img src="/static/images/GreenStarboardArrowLabeled.png" alt="Starboard Goal">
                </button>
            </div>
            <div id="right_2">   
                <span style="font-size:48px" id="servoEnabled">Servo is Disabled</span>
                <br>
                <button id="servoToggleBtn">Enable<br>Servo</button>
            </div> 
            <div id="right_3">
                Engine Speed:<br>
                <span style="font-family:monospace; white-space:pre;" id="EngineSpeed">----</span>
            </div>       
            <div id="right_4">
                <span style="font-size:48px" id="right_turn_message">Turn Disabled</span>
                <br>
                <button id="RightTurn">
                    Right Turn
                </button>
            </div>
        </div>
    </div>

    <footer>
        <div><button id="graphsBtn"><span style="font-size:48px">Graphs</span></button></div>
        <div><span id="ipAddress">IP Address</span></div>
        <div><button id="shutdownBtn"><span style="font-size:48px">Exit</span></button></div>
    </footer>
    <!-- Custom confirmation modal -->
    <div id="confirmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); justify-content:center; align-items:center;">
        <div style="background:white; padding:40px; border-radius:10px; text-align:center; max-width:500px;">
            <p style="font-size:48px; color:black;">Are you sure you want to exit?</p>
            <div style="margin-top:20px;">
                <button id="confirmYes" style="font-size:48px; margin-right:20px; padding:10px 30px;">Yes</button>
                <button id="confirmNo" style="font-size:48px; padding:10px 30px;">No</button>
            </div>
        </div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/compass.js"></script>
    <script>
        const shutdownBtn = document.getElementById("shutdownBtn");
        const confirmModal = document.getElementById("confirmModal");
        const confirmYes = document.getElementById("confirmYes");
        const confirmNo = document.getElementById("confirmNo");

        shutdownBtn.addEventListener("click", function () {
            confirmModal.style.display = "flex"; // Show the modal
        });

        confirmYes.addEventListener("click", function () {
            fetch("/exit-browser", { method: "POST" })
                .then(response => {
                    if (response.ok) {
                        console.log("Exit request sent");
                    } else {
                        console.error("Failed to send exit request");
                    }
                })
                .catch(err => console.error("Error:", err));
            confirmModal.style.display = "none"; // Hide modal after click
        });

        confirmNo.addEventListener("click", function () {
            confirmModal.style.display = "none"; // Hide modal
        });
    </script>
</body>
</html>
